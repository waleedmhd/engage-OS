name: backend-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engageos
          POSTGRES_PASSWORD: engageos
          POSTGRES_DB: engageos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U engageos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://engageos:engageos@localhost:5432/engageos
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-min-32-characters-xxxxx

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check . --fix

      - name: Mypy
        run: mypy app

      - name: Run database migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest
