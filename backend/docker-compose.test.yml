services:
  postgres-test:
    image: postgres:16-alpine
    container_name: engageos_test_postgres
    environment:
      POSTGRES_USER: engageos
      POSTGRES_PASSWORD: engageos
      POSTGRES_DB: engageos_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engageos -d engageos_test"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"

  redis-test:
    image: redis:7-alpine
    container_name: engageos_test_redis
    ports:
      - "56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
    command: ["redis-server", "--save", "", "--appendonly", "no"]
